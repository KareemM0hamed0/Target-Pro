<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1324"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes">
<title>Target Pro</title>
<style>
:root{color-scheme:dark;--bg:#0b1324;--card:#141d33;--c2:#1b2742;--tx:#f4f7fb;--mu:#93a1bd;--g:#22c55e;--o:#f59e0b;--r:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(160deg,#0b1324,#1c2230);background-attachment:fixed;color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
#app{padding:12px 14px 150px;max-width:560px;margin:0 auto}
.card{background:linear-gradient(145deg,var(--card),#10182b);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px #0006}
.ctr{text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--c2);border-radius:14px;padding:12px}.st small{color:var(--mu);display:block;font-size:12px}.st b{font-size:20px}
.mh{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}.mh b{font-size:18px}
button{font:inherit;color:var(--tx);border:0;border-radius:12px;background:var(--c2);padding:10px 14px;cursor:pointer}
button.p{background:var(--g);color:#05210f;font-weight:700}button.d{background:#3b1d24;color:#fca5a5}
input,select,textarea{font:inherit;width:100%;background:#0e1730;color:var(--tx);border:1px solid #2a3858;border-radius:12px;padding:11px;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
h3{margin:0 0 10px;font-size:16px}.mu{color:var(--mu);font-size:13px}.g{color:var(--g)}.o{color:var(--o)}.r{color:var(--r)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ring{transition:stroke-dashoffset 1.2s ease-out}
#fab{position:fixed;inset-inline-start:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--g);color:#05210f;font-weight:800;border-radius:30px;padding:15px 20px;box-shadow:0 8px 22px #22c55e55;z-index:5;display:flex}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:#0d1528f2;backdrop-filter:blur(8px);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;border-top:1px solid #233152}
nav button{flex:1;background:none;color:var(--mu);font-size:13px;padding:10px 2px}nav button.on{color:var(--g);font-weight:700}
.ov{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#121b30;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.bar{height:10px;border-radius:6px;background:var(--g);transition:width .8s}.bt{background:#0e1730;border-radius:6px;flex:1}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#243252}
.s-installed{color:var(--g)}.s-scheduled,.s-pending{color:var(--o)}.s-cancelled{color:var(--r)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.days button{padding:8px 0}.days .off{background:var(--r);color:#fff}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}.ban{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#14532d;padding:10px 14px;font-size:14px;position:sticky;top:0;z-index:7}nav button{font-size:12px!important}@media print{nav,#fab,.ban,button{display:none!important}body{background:#fff;color:#000}.card,.st{box-shadow:none;background:#fff;color:#000}}</style></head><body>
<div id="ban"></div><div id="app"></div>
<button id="fab" onclick="qa()">＋ إضافة</button>
<nav><button data-t="home" onclick="go('home')">الرئيسية</button><button data-t="cust" onclick="go('cust')">العملاء</button><button data-t="sales" onclick="go('sales')">المبيعات</button><button data-t="inst" onclick="go('inst')">التركيبات</button><button data-t="more" onclick="go('more')">المزيد</button></nav>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s),K='targetpro_v1',pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0=x=>Math.round(x).toLocaleString('en-US'),n2=x=>(Math.round(x*100)/100).toLocaleString('en-US');
const ST={installed:'تم التركيب',scheduled:'مجدول',pending:'معلق',cancelled:'ملغي'};
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let S,U={tab:'home',m:today().slice(0,7),q:'',fp:'',fs:'',fd:''};
function seed(){const P=[['Birdie Smart Mirror',1349],['Dashcam Pro',1150],['Dashcam Ultra',1349],['Dashcam Eagle',950],['GPS Tracker',600]].map(x=>({id:uid(),name:x[0],price:x[1]}));
const t=today(),mk=(i,q)=>({id:uid(),pid:P[i].id,name:P[i].name,qty:q,price:P[i].price,date:t,status:'installed'});
S={target:20000,inc:false,products:P,sales:[mk(0,1),mk(1,1),mk(2,3)],off:{}};save()}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.sales)||!Array.isArray(S.products))seed();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const mOf=d=>d.slice(0,7),dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
function cnt(s){return live(s)&&s.ss!=='pending'&&(s.status==='installed'||(S.inc&&(s.status==='scheduled'||s.status==='pending')))}
const tot=s=>s.qty*s.price;
function st(m){const t=today(),cm=mOf(t),D=dim(m),all=S.sales.filter(s=>mOf(s.date)===m),cs=all.filter(cnt);
const conf=cs.reduce((a,s)=>a+tot(s),0),dev=cs.reduce((a,s)=>a+s.qty,0);
const pn=all.filter(s=>!cnt(s)&&live(s)),pend=pn.reduce((a,s)=>a+tot(s),0);
const el=m<cm?D:m>cm?0:+t.slice(8),first=m<cm?D+1:m>cm?1:+t.slice(8),left=D-first+1,off=(S.off&&S.off[m])||[];
let wl=0;for(let d=first;d<=D;d++)if(!isOff(m+'-'+pad(d)))wl++;
const rem=Math.max(0,T(m)-conf),req=wl?rem/wl:rem;
const ts=cs.filter(s=>s.date===t).reduce((a,s)=>a+tot(s),0),before=conf-ts;
const tt=isOff(t)?0:(wl?Math.max(0,T(m)-before)/wl:0);
return{all,cs,conf,dev,pend,pn,D,el,left,wl,rem,req,pct:T(m)?conf/T(m)*100:0,ts,tt,cm,off}}
function go(t){U.tab=t;render();scrollTo(0,0)}
function sm(d){let y=+U.m.slice(0,4),m=+U.m.slice(5)+d;if(m<1){m=12;y--}if(m>12){m=1;y++}U.m=y+'-'+pad(m);render()}
const mh=()=>`<div class="mh"><button onclick="sm(-1)">›</button><b>${MN[+U.m.slice(5)-1]} ${U.m.slice(0,4)}</b><button onclick="sm(1)">‹</button></div>`;
function vHome(){const s=st(U.m),C=439.8,late=U.m<s.cm&&s.pct<100,o=C*(1-Math.min(100,s.pct)/100);
const dc=U.m===s.cm?`<div class="card"><h3>هدف اليوم</h3><div class="grid"><div class="st"><small>مبيعات اليوم</small><b class="g">${n0(s.ts)}</b></div><div class="st"><small>هدف اليوم</small><b>${n0(s.tt)}</b></div></div>
<p class="${s.ts>=s.tt?'g':'o'}"><b>${s.tt===0?'اليوم إجازة':s.ts>=s.tt?'✅ تم تحقيق هدف اليوم':'المتبقي اليوم: '+n0(s.tt-s.ts)+' SAR'}</b></p></div>`:'';
return mh()+`<div class="card ctr"><svg viewBox="0 0 180 180" width="230" height="230"><circle cx="90" cy="90" r="70" fill="none" stroke="${late?'#ef4444':'#f59e0b'}" stroke-opacity=".35" stroke-width="14"/>
<circle class="ring" cx="90" cy="90" r="70" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-o="${o}" transform="rotate(-90 90 90)"/>
<text x="90" y="92" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">${n2(s.pct)}%</text><text x="90" y="116" text-anchor="middle" fill="#93a1bd" font-size="11">من ${n0(T(U.m))} SAR</text></svg></div>
<div class="grid"><div class="st"><small>المبيعات المؤكدة</small><b class="g">${n0(s.conf)}</b></div><div class="st"><small>المتبقي للهدف</small><b class="${late?'r':'o'}">${n0(s.rem)}</b></div>
<div class="st"><small>الأجهزة المباعة</small><b>${s.dev}</b></div><div class="st"><small>الأيام المتبقية</small><b>${s.left}</b></div>
<div class="st"><small>المطلوب يوميًا</small><b class="o">${n0(s.req)}</b></div><div class="st"><small>الهدف الشهري</small><b>${n0(T(U.m))}</b></div></div>
<div style="height:12px"></div>${dc}
<div class="card"><div class="row"><h3>قيد التنفيذ (مجدول / معلق)</h3><b class="o">${n0(s.pend)}</b></div><p class="mu">${s.pn.length} عملية ${S.inc?'(محتسبة ضمن المؤكد)':'(غير محتسبة)'}</p>
<button onclick="S.inc=!S.inc;save();render()">${S.inc?'استبعادها من المؤكد':'احتسابها ضمن المؤكد'}</button></div>`}
function listH(){const q=U.q.trim().toLowerCase();let a=S.sales.filter(s=>mOf(s.date)===U.m).filter(s=>(!q||s.name.toLowerCase().includes(q))&&(!U.fp||s.pid===U.fp)&&(!U.fs||s.status===U.fs)&&(!U.fd||s.date===U.fd)).sort((x,y)=>y.date.localeCompare(x.date));
return a.length?a.map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><b class="g">${n0(tot(s))} SAR</b></div><p class="mu" style="margin:6px 0">${s.qty} × ${n2(s.price)} SAR · ${s.date}</p>
<div class="row"><span class="tag s-${s.status}">${ST[s.status]}</span><span><button onclick="openSale('${s.id}')">تعديل</button> <button class="d" onclick="delSale('${s.id}')">حذف</button></span></div></div>`).join(''):'<p class="mu ctr">لا توجد عمليات</p>'}
function vSales(){return mh()+`<div class="card"><input placeholder="بحث باسم المنتج" value="${esc(U.q)}" oninput="U.q=this.value;$('#lst').innerHTML=listH()">
<select onchange="U.fp=this.value;$('#lst').innerHTML=listH()"><option value="">كل المنتجات</option>${S.products.map(p=>`<option value="${p.id}" ${U.fp===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
<select onchange="U.fs=this.value;$('#lst').innerHTML=listH()"><option value="">كل الحالات</option>${Object.keys(ST).map(k=>`<option value="${k}" ${U.fs===k?'selected':''}>${ST[k]}</option>`).join('')}</select>
<input type="date" value="${U.fd}" onchange="U.fd=this.value;$('#lst').innerHTML=listH()"></div><div id="lst">${listH()}</div>`}
function bar(l,v,mx){return `<div class="row" style="margin:6px 0"><span class="mu" style="min-width:70px">${l}</span><div class="bt"><div class="bar" style="width:${mx?Math.max(2,v/mx*100):2}%"></div></div><b style="min-width:62px;text-align:left">${n0(v)}</b></div>`}
const sumD=(m,f)=>S.sales.filter(s=>cnt(s)&&f(s.date)).reduce((a,s)=>a+tot(s),0);
function vAn(){const s=st(U.m),[y,mo]=U.m.split(/-/).map(Number),end=U.m===s.cm?new Date():new Date(y,mo-1,s.D);
const days=[];for(let i=6;i>=0;i--){const d=new Date(end.getFullYear(),end.getMonth(),end.getDate()-i);days.push([ds(d),sumD(0,x=>x===ds(d))])}
const wk=[[1,7],[8,14],[15,21],[22,s.D]].map(([a,b])=>['أيام '+a+'-'+b,sumD(0,x=>mOf(x)===U.m&&+x.slice(8)>=a&&+x.slice(8)<=b)]);
const ms=[...new Set([...S.sales.map(x=>mOf(x.date)),s.cm])].sort().slice(-6).map(m=>[m,sumD(0,x=>mOf(x)===m)]);
const bp={};s.cs.forEach(x=>bp[x.name]=(bp[x.name]||0)+x.qty);const best=Object.entries(bp).sort((a,b)=>b[1]-a[1])[0];
const proj=U.m===s.cm?(s.el?s.conf/s.el*s.D:0):s.conf,avgT=s.cs.length?s.conf/s.cs.length:0,avgD=s.el?s.dev/s.el:0;
const mx=a=>Math.max(1,...a.map(x=>x[1]));
const SC=[{Ultra:3,Pro:2,Eagle:1},{Eagle:5},{Pro:4}];
const scH=SC.map(c=>{const parts=Object.entries(c).map(([k,q])=>[S.products.find(p=>p.name.toLowerCase().includes(k.toLowerCase())),q,k]);if(parts.some(p=>!p[0]))return'';
const v=parts.reduce((a,p)=>a+p[0].price*p[1],0);return `<div class="st" style="margin-bottom:8px"><b>${parts.map(p=>p[1]+' '+p[2]).join(' + ')}</b><div class="mu">القيمة ${n0(v)} SAR · ${v>=s.rem?'<span class="g">تحقق الهدف</span>':'يتبقى '+n0(s.rem-v)+' SAR'} · تكرارها ${v?Math.ceil(s.rem/v):0} مرة</div></div>`}).join('');
return mh()+`<div class="grid"><div class="st"><small>أفضل منتج</small><b style="font-size:15px">${best?esc(best[0])+' ('+best[1]+')':'-'}</b></div><div class="st"><small>متوسط العملية</small><b>${n0(avgT)}</b></div>
<div class="st"><small>متوسط الأجهزة يوميًا</small><b>${n2(avgD)}</b></div><div class="st"><small>المتوقع نهاية الشهر</small><b class="${proj>=T(U.m)?'g':'o'}">${n0(proj)}</b></div></div><div style="height:12px"></div>
<div class="card"><h3>آخر 7 أيام</h3>${days.map(d=>bar(d[0].slice(5),d[1],mx(days))).join('')}</div>
<div class="card"><h3>الأسابيع</h3>${wk.map(d=>bar(d[0],d[1],mx(wk))).join('')}</div>
<div class="card"><h3>مقارنة الشهور</h3>${ms.map(d=>bar(MN[+d[0].slice(5)-1],d[1],mx(ms))).join('')}</div>
<div class="card"><h3>كم جهاز أحتاج لتحقيق الهدف؟</h3><p class="mu">المتبقي: ${n0(s.rem)} SAR</p>
${S.products.map(p=>`<div class="row" style="margin:6px 0"><span>${esc(p.name)} <span class="mu">(${n0(p.price)})</span></span><b class="o">${p.price>0?Math.ceil(s.rem/p.price):0} جهاز</b></div>`).join('')}
<h3 style="margin-top:14px">سيناريوهات مختلطة</h3>${scH||'<p class="mu">أضف منتجات بأسماء Ultra / Pro / Eagle</p>'}</div>`}
function vSet(){const s=st(U.m),D=s.D;
return mh()+`<div class="card"><h3>الهدف الشهري (SAR)</h3><input type="number" min="1" value="${T(U.m)}" onchange="setT(this.value)">
<label><input type="checkbox" style="width:auto" ${S.inc?'checked':''} onchange="S.inc=this.checked;save()"> احتساب المجدول والمعلق ضمن المبيعات المؤكدة</label></div>
<div class="card"><h3>أيام الإجازة (اضغط لتبديل)</h3><div class="days">${Array.from({length:D},(_,i)=>{const d=U.m+'-'+pad(i+1),o=s.off.includes(d);return `<button class="${o?'off':''}" onclick="tOff('${d}')">${i+1}</button>`}).join('')}</div></div>
<div class="card"><h3>المنتجات</h3>${S.products.map(p=>`<div style="margin-bottom:10px"><input value="${esc(p.name)}" onchange="pe('${p.id}','name',this.value)"><div class="row"><input type="number" min="1" value="${p.price}" onchange="pe('${p.id}','price',this.value)"><button class="d" style="margin-bottom:10px" onclick="delP('${p.id}')">حذف</button></div></div>`).join('')}
<h3>منتج جديد</h3><input id="np_n" placeholder="الاسم"><input id="np_p" type="number" placeholder="السعر"><button class="p" onclick="addP()">إضافة منتج</button></div>
<div class="card"><h3>التقارير والبيانات</h3><div class="grid"><button onclick="exCSV()">تصدير CSV</button><button onclick="exSum()">ملخص الشهر</button><button onclick="exJSON()">نسخة احتياطية</button><button onclick="openRest()">استعادة</button></div>
<p class="mu">لا تُحذف مبيعات الشهور السابقة عند بدء شهر جديد.</p></div>`}
function render(){$('#app').innerHTML={home:vHome,sales:vSales,an:vAn,calc:vCalc,set:vSet}[U.tab]();$('#fab').style.display=['home','sales','cust','inst'].includes(U.tab)?'flex':'none';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===U.tab));
const r=document.querySelector('.ring');if(r)requestAnimationFrame(()=>requestAnimationFrame(()=>r.style.strokeDashoffset=r.dataset.o))}
function modal(h){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)cm()"><div class="sheet">${h}</div></div>`}
const cm=()=>$('#modal').innerHTML='';
function ask(msg,fn){window._cb=fn;modal(`<h3>${msg}</h3><div class="grid"><button class="d" onclick="cm();_cb()">تأكيد</button><button onclick="cm()">إلغاء</button></div>`)}
function setT(v){v=+v;if(!(v>0)){alert('أدخل رقمًا صحيحًا أكبر من صفر');render();return}S.mt=S.mt||{};S.mt[U.m]=v;save();render()}
function tOff(d){const m=mOf(d);S.off=S.off||{};const a=S.off[m]||[];S.off[m]=a.includes(d)?a.filter(x=>x!==d):[...a,d];save();render()}
function pe(id,k,v){const p=S.products.find(x=>x.id===id);if(k==='price'){v=+v;if(!(v>0)){alert('سعر غير صالح');render();return}}else if(!v.trim()){alert('الاسم مطلوب');render();return}p[k]=k==='price'?v:v.trim();save()}
function delP(id){ask('حذف المنتج؟ (المبيعات السابقة لن تتأثر)',()=>{S.products=S.products.filter(p=>p.id!==id);save();render()})}
function addP(){const n=$('#np_n').value.trim(),p=+$('#np_p').value;if(!n||!(p>0)){alert('أدخل اسمًا وسعرًا صحيحًا');return}S.products.push({id:uid(),name:n,price:p});save();render()}
function openSale(id){const s=id?S.sales.find(x=>x.id===id):null;let opts=S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
if(s&&!S.products.some(p=>p.id===s.pid))opts=`<option value="${s.pid}">${esc(s.name)}</option>`+opts;
const d=s||{pid:S.products[0]?S.products[0].id:'',qty:1,price:S.products[0]?S.products[0].price:'',date:today()<U.m+'-01'||mOf(today())!==U.m?U.m+'-01':today(),status:'installed'};if(!s&&mOf(today())===U.m)d.date=today();
modal(`<h3>${s?'تعديل عملية بيع':'إضافة عملية بيع'}</h3><label>المنتج</label><select id="f_p" onchange="pc()">${opts}</select>
<div class="grid"><div><label>الكمية</label><input id="f_q" type="number" min="1" step="1" value="${d.qty}" oninput="ct()"></div><div><label>سعر الوحدة (SAR)</label><input id="f_pr" type="number" min="0" step="any" value="${d.price}" oninput="ct()"></div></div>
<label>التاريخ</label><input id="f_d" type="date" value="${d.date}"><label>حالة التركيب</label><select id="f_s">${Object.keys(ST).map(k=>`<option value="${k}" ${d.status===k?'selected':''}>${ST[k]}</option>`).join('')}</select>
<h3 class="g" id="f_t"></h3><div class="grid"><button class="p" onclick="saveSale('${id||''}')">حفظ</button><button onclick="cm()">إلغاء</button></div>`);
$('#f_p').value=d.pid;ct()}
function pc(){const p=S.products.find(x=>x.id===$('#f_p').value);if(p)$('#f_pr').value=p.price;ct()}
function ct(){$('#f_t').textContent='الإجمالي: '+n2((+$('#f_q').value||0)*(+$('#f_pr').value||0))+' SAR'}
function saveSale(id){const q=+$('#f_q').value,pr=+$('#f_pr').value,dt=$('#f_d').value,sel=$('#f_p'),pid=sel.value,name=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:'';

const DB={db:null,open(){return new Promise((ok,no)=>{const r=indexedDB.open('targetpro',3);r.onupgradeneeded=()=>['kv',...Object.values(COLS)].forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})});r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>no(r.error)})},
tx(names,fn){return new Promise((ok,no)=>{const t=this.db.transaction(names,'readwrite');fn(t);t.oncomplete=ok;t.onerror=()=>no(t.error)})},
all(n){return new Promise((ok,no)=>{const q=this.db.transaction(n).objectStore(n).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}};
const H={};
function stamp(col,arr){const keys=new Set();arr.forEach(r=>{const k=col+r.id,j=JSON.stringify({...r,updated_at:0});keys.add(k);if(!r.created_at)r.created_at=now();if(!r.owner_id)r.owner_id=OWN;if(H[k]!==j){if(H[k]!==undefined||r.updated_at===undefined)r.updated_at=now();H[k]=j}});
for(const k in H)if(k.startsWith(col)&&!keys.has(k)){(S.del=S.del||[]).push({col,id:k.slice(col.length),at:now()});delete H[k]}}
async function persist(){CK.forEach(k=>stamp(k,S[k]));try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(!DB.db)return;const set={...S};CK.forEach(k=>delete set[k]);
try{await DB.tx(['kv',...Object.values(COLS)],t=>{t.objectStore('kv').put({id:'settings',...set});CK.forEach(k=>{const os=t.objectStore(COLS[k]);os.clear();S[k].forEach(r=>os.put(r))})})}catch(e){console.warn(e)}}
function save(){clearTimeout(save._t);save._t=setTimeout(persist,100)}
async function boot(){try{await DB.open();const kv=(await DB.all('kv')).find(x=>x.id==='settings');if(kv){const n={...kv};delete n.id;for(const k of CK)n[k]=await DB.all(COLS[k]);S=n;migrate()}CK.forEach(k=>stamp(k,S[k]));await persist()}catch(e){console.warn('IDB unavailable',e)}render()}

function cl(s){const g=tot(s),p=prodO(s.pid)||{},r=p.cr!==''&&p.cr!=null?+p.cr:+S.cm.rate,t=p.tax!==''&&p.tax!=null?+p.tax:+(S.cm.tax[S.cm.cty]||0),tx=g-g/(1+t/100),n=g-tx,amt=(S.cm.mode==='net'?n:g)*r/100;

else if(m(/خسر|خسار|فقد|lost|lose/i)){const by={};S.customers.filter(c=>c.stg===9).forEach(c=>by[c.lr||'غير محدد']=(by[c.lr||'غير محدد']||0)+1);const a=Object.entries(by).sort((x,y)=>y[1]-x[1]);f.push(a.length?'أسباب الخسارة المسجلة: '+a.map(x=>x[0]+' ('+x[1]+')').join('، '):'لا توجد فرص ضائعة مسجلة');if(a[0])g.push(LREC[a[0][0]]||'')}

else if(m(/أتابع|اتابع|متابع|follow/i)){const n=needF();f.push(n.length?'عدد العملاء المطلوب متابعتهم: '+n.length:'لا متابعات مستحقة');n.slice(0,6).forEach(c=>f.push(`${c.name} — ${STG[c.stg]} (${score(c).cls})`));if(n.length)g.push('ابدأ بالأعلى تصنيفًا')}
else if(m(/أسبوع|حلل|week/i)){const a=weekSum(0),b=weekSum(1);f.push(`آخر 7 أيام: ${n0(a.r)} SAR، ${a.q} جهاز، ${a.o} طلب`,`الأسبوع الذي قبله: ${n0(b.r)} SAR، ${b.q} جهاز`);e.push(b.r?`التغير: ${n2((a.r-b.r)/b.r*100)}%`:'لا مقارنة متاحة')}
else if(m(/منتج|إيراد|product|revenue/i)){const by={};s.cs.forEach(x=>by[x.name]=(by[x.name]||0)+tot(x));const a=Object.entries(by).sort((x,y)=>y[1]-x[1]);f.push(a.length?`الأعلى إيرادًا هذا الشهر: ${a[0][0]} (${n0(a[0][1])} SAR)`:'لا مبيعات مؤكدة هذا الشهر')}
else if(m(/هدف|يومي|target|daily|نسبة/i)){f.push(`المؤكد ${n0(s.conf)} من ${n0(T(U.m))} SAR (${n2(s.pct)}%)`,'المتبقي: '+n0(s.rem)+' SAR');e.push(`المطلوب ≈ ${n0(s.req)} SAR لكل يوم عمل (${s.wl} يوم متبقٍ)`)}
else g.push('جرّب أحد الأسئلة السريعة أعلاه');
const sec=(t,a)=>a.length?`<p style="margin:8px 0 2px"><b>${t}</b></p>${a.map(x=>`<p style="margin:2px 0">• ${esc(x)}</p>`).join('')}`:'';return sec('✅ حقائق من بياناتك',f)+sec('📈 تقديرات',e)+sec('💡 اقتراحات',g)}
function askAI(q){q=(q||$('#ai_q').value).trim();if(!q)return;U.aq=q;U.aa=aiAns(q);render()}
function vAI(){const s=st(U.m),a=weekSum(0),b=weekSum(1),n=needF().length,ch=['من أتابع اليوم؟','أعلى العملاء احتمالًا للشراء','ما نسبة تحقيق الهدف؟','كم أحتاج يوميًا؟','أي منتج الأعلى إيرادًا؟','حلل مبيعات هذا الأسبوع','لماذا أخسر العملاء؟','العميل يقول غالي','اكتب رسالة متابعة','أفضل تركيبة لتحقيق الهدف','اقتراح لميزانية محدودة'];
return `<div class="card" style="margin-top:8px"><h3>المدرب 🏅</h3><p style="margin:6px 0">• اليوم: ${n0(s.ts)} من ${n0(s.tt)} SAR</p><p style="margin:6px 0">• هذا الأسبوع ${n0(a.r)} SAR مقابل ${n0(b.r)} الأسبوع السابق</p><p style="margin:6px 0">• ${n} عميل بانتظار متابعتك</p><p style="margin:6px 0">• تحتاج ≈ ${n0(s.req)} SAR لكل يوم عمل</p></div>
<div class="card"><div class="row"><h3>المساعد 🤖</h3><label style="color:var(--tx)"><input type="checkbox" style="width:auto" ${S.ai.on?'checked':''} onchange="S.ai.on=this.checked;save();render()"> مفعّل</label></div><p class="mu">مزوّد الذكاء الاصطناعي الخارجي: <b>غير متصل</b>. الإجابات من محرك قواعد محلي على بياناتك، يعمل أوفلاين ولا يرسل أي بيانات. الربط مستقبلًا يتطلب وسيط خادم يحفظ المفتاح وموافقتك قبل إرسال أي بيانات عملاء.</p>
${S.ai.on?`<div class="row" style="flex-wrap:wrap;justify-content:flex-start;margin:8px 0">${ch.map(x=>`<button style="font-size:12px" onclick="askAI(this.textContent)">${x}</button>`).join('')}</div><input id="ai_q" placeholder="اكتب سؤالك" value="${esc(U.aq||'')}"><button class="p" onclick="askAI()">اسأل</button>${U.aa?`<div class="st" style="margin-top:10px">${U.aa}</div>`:''}`:'<p class="mu">المساعد معطّل</p>'}</div>`}
/* calendar (week) + quick actions */
function vCal(){const o=U.cw||0,b=new Date();b.setDate(b.getDate()-b.getDay()+o*7);const D=Array.from({length:7},(_,i)=>{const d=new Date(b);d.setDate(b.getDate()+i);return d}),W=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
return `<div class="mh"><button onclick="U.cw=(U.cw||0)-1;render()">›</button><b>${ds(D[0])} ← ${ds(D[6])}</b><button onclick="U.cw=(U.cw||0)+1;render()">‹</button></div>`+D.map((d,i)=>{const k=ds(d),ev=[...S.inst.filter(x=>x.date===k&&!fin(x)).map(x=>({t:x.time||'',x:'🔧 تركيب '+cname(x.cid),a:`openInst('${x.id}')`})),...S.tasks.filter(x=>x.date===k&&!x.done).map(x=>({t:x.time||'',x:'📞 '+TT[x.type]+' — '+cname(x.cid),a:x.cid?`openCDet('${x.cid}')`:''}))].sort((a,c)=>a.t.localeCompare(c.t));
return `<div class="card" ${k===today()?'style="border:1px solid var(--g)"':''}><b>${W[i]} ${k.slice(5)}</b>${ev.map(e=>`<div class="row" style="margin-top:6px" onclick="${e.a}"><span>${esc(e.x)}</span><span class="mu">${e.t}</span></div>`).join('')||'<p class="mu" style="margin:4px 0">لا أحداث</p>'}</div>`}).join('')+`<button class="p" style="width:100%" onclick="openTask()">＋ موعد / متابعة</button>`}
function qa(){const aw=S.inst.filter(i=>!fin(i)&&!i.date).slice(0,6);modal(`<h3>إجراء سريع</h3><div class="grid"><button class="p" onclick="cm();openCust()">👤 عميل جديد</button><button class="p" onclick="cm();openSale()">💰 عملية بيع</button><button class="p" onclick="cm();openTask()">📞 متابعة</button><button onclick="cm();go('inst')">🔧 التركيبات</button></div>${aw.length?'<h3 style="margin-top:12px">جدولة تركيب</h3>'+aw.map(i=>`<button style="width:100%;margin:4px 0" onclick="cm();openInst('${i.id}')">${esc(cname(i.cid))} · ${esc(i.oid)}</button>`).join(''):''}`)}
/* backup status, snapshots, PIN lock */
function snaps(){try{return JSON.parse(localStorage.getItem('tp_snaps'))||[]}catch(e){return[]}}
function snap(force){const a=snaps(),d=today();if(!force&&a[0]&&a[0].date===d)return;a.unshift({at:now(),date:d,json:JSON.stringify(S)});try{localStorage.setItem('tp_snaps',JSON.stringify(a.slice(0,3)))}catch(e){}}
function restSnap(i){const o=JSON.parse(snaps()[i].json);ask('دمج هذه اللقطة مع بياناتك؟ (الأحدث يفوز ولا يُحذف شيء)',()=>{snap(true);CK.forEach(k=>S[k]=mergeCol(S[k]||[],o[k],k));migrate();save();render()})}
const bkDue=()=>S.sales.length&&(!S.bk.last||(Date.now()-S.bk.last)/864e5>=(S.bk.days||7));
const _ej=exJSON;exJSON=function(){S.bk.last=now();save();_ej()};
const _bn=banner;banner=function(){_bn();if(bkDue())$('#ban').insertAdjacentHTML('beforeend','<div class="ban" style="background:#713f12"><span>حان وقت نسخة احتياطية</span><button class="p" onclick="exJSON()">نسخ الآن</button></div>')};
let SEC={};try{SEC=JSON.parse(localStorage.getItem('tp_sec'))||{}}catch(e){}
const sSave=()=>localStorage.setItem('tp_sec',JSON.stringify(SEC)),act=()=>LA=Date.now();let LA=Date.now();
async function hp(p){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode((SEC.salt||'')+p)))].map(x=>x.toString(16).padStart(2,'0')).join('')}
function lockUI(){if(!SEC.h||document.querySelector('#lk'))return;const d=document.createElement('div');d.id='lk';d.style.cssText='position:fixed;inset:0;z-index:99;background:#0b1324;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px';
d.innerHTML=`<h2>🔒 Target Pro</h2><input id="lk_p" type="password" inputmode="numeric" placeholder="الرقم السري" style="width:200px;text-align:center"><button class="p" onclick="unlock()">فتح</button>${SEC.bio?'<button onclick="bioUnlock()">بصمة / قفل الجهاز</button>':''}<small class="mu" id="lk_e"></small>`;document.body.appendChild(d)}
async function unlock(){if(await hp($('#lk_p').value)===SEC.h){$('#lk').remove();act()}else{$('#lk_e').textContent='رقم خاطئ';$('#lk_p').value=''}}
function pinUI(){modal(`<h3>${SEC.h?'تغيير الرقم السري':'تعيين رقم سري'}</h3><input id="pn1" type="password" inputmode="numeric" placeholder="4–8 أرقام"><input id="pn2" type="password" inputmode="numeric" placeholder="تأكيد الرقم"><div class="grid"><button class="p" onclick="setPin()">حفظ</button><button onclick="cm()">إلغاء</button></div>`)}
async function setPin(){const a=$('#pn1').value;if(!/^\d{4,8}$/.test(a)||a!==$('#pn2').value){alert('أدخل 4–8 أرقام متطابقة');return}SEC.salt=uid();SEC.h=await hp(a);SEC.auto=SEC.auto||5;sSave();cm();render()}
function rmPin(){ask('إزالة القفل؟',()=>{SEC={};sSave();render()})}
async function bioReg(){try{if(!window.PublicKeyCredential)throw 0;const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Target Pro'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'user',displayName:'user'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});SEC.bio=btoa(String.fromCharCode(...new Uint8Array(c.rawId)));sSave();render();toast('تم تفعيل البصمة')}catch(e){alert('البصمة غير مدعومة أو أُلغيت على هذا الجهاز')}}
async function bioUnlock(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:Uint8Array.from(atob(SEC.bio),x=>x.charCodeAt(0))}],userVerification:'required',timeout:60000}});$('#lk').remove();act()}catch(e){$('#lk_e').textContent='فشل التحقق'}}
['click','touchstart','keydown'].forEach(e=>addEventListener(e,act,{passive:true}));setInterval(()=>{if(SEC.h&&SEC.auto&&Date.now()-LA>SEC.auto*6e4)lockUI()},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SEC.h&&SEC.auto&&Date.now()-LA>SEC.auto*6e4)lockUI()});
function vSec(){const l=S.bk.last,sn=snaps();return `<div class="card" style="margin-top:8px"><h3>حالة النسخ الاحتياطي</h3><p class="${bkDue()?'o':'g'}"><b>آخر نسخة: ${l?new Date(l).toLocaleString('ar-EG'):'لم تُؤخذ بعد'}</b></p><label>تذكير كل (أيام)</label><input type="number" min="1" value="${S.bk.days||7}" onchange="S.bk.days=Math.max(1,+this.value||7);save();render()">
<div class="grid"><button class="p" onclick="exJSON()">نسخة JSON الآن</button><button onclick="openRest()">استعادة</button></div><h3 style="margin-top:14px">لقطات تلقائية (آخر 3)</h3>${sn.map((x,i)=>`<div class="row" style="margin:6px 0"><span class="mu">${new Date(x.at).toLocaleString('ar-EG')}</span><button onclick="restSnap(${i})">دمج</button></div>`).join('')||'<p class="mu">لا لقطات بعد</p>'}<button style="margin-top:8px" onclick="snap(true);render()">لقطة الآن</button></div>
<div class="card"><h3>القفل بالرقم السري</h3><p class="mu">اختياري. يقفل واجهة التطبيق فقط ولا يشفّر البيانات المخزنة؛ من يملك الجهاز مفتوحًا أو أدوات المتصفح يمكنه الوصول إليها. استخدمه مع قفل شاشة الهاتف.</p>
<div class="grid"><button class="p" onclick="pinUI()">${SEC.h?'تغيير الرقم':'تعيين رقم سري'}</button>${SEC.h?'<button class="d" onclick="rmPin()">إزالة القفل</button>':''}</div>${SEC.h?`<label style="display:block;margin-top:10px">قفل تلقائي بعد (دقائق، 0 = معطّل)</label><input type="number" min="0" value="${SEC.auto||0}" onchange="SEC.auto=Math.max(0,+this.value||0);sSave()"><button onclick="bioReg()">${SEC.bio?'✔ البصمة مفعّلة — إعادة تسجيل':'تفعيل البصمة / قفل الجهاز'}</button><p class="mu">البصمة تعتمد على مصادقة الجهاز عبر WebAuthn وتتطلب HTTPS، وتتحقق محليًا فقط.</p>`:''}</div>`}
const _boot=boot;boot=async function(){lockUI();await _boot();snap();banner()};

render();boot();
</script></body></html>
